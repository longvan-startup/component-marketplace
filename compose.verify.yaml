# ==========================================================================
# compose.verify.yaml — isolation overlay for verify.sh --docker smoke runs
# ==========================================================================
# Used ONLY as: docker compose -p <unique-project> -f compose.yaml -f compose.verify.yaml ...
# Everything here must stay throwaway-safe:
#  - NO host ports are published (all probes run inside the compose network),
#    so an isolated project can never conflict with the development stack.
#  - The unique project name (-p cmp-verify-*) scopes named volumes; cleanup is
#    `down -v --remove-orphans` which removes ONLY volumes labeled with that
#    project — the development "component-marketplace" stack is untouched.
#  - The `migrate` service runs drizzle-kit inside the network against the
#    throwaway postgres (no DB credentials leave the compose network).
# Requires docker compose >= 2.24 for the !override merge tags.
services:
  web:
    ports: !override []

  api:
    ports: !override []
    environment:
      # Isolated smoke-only value; never use this outside verify containers.
      BETTER_AUTH_SECRET: verify-only-secret-do-not-use-outside-smoke-123456
      BETTER_AUTH_URL: http://localhost:4000

  postgres:
    ports: !override []

  # Verify-only service: applies Drizzle migrations to the throwaway DB.
  # Uses the monorepo's installed drizzle-kit via bind mount (pinned version,
  # no network resolution drift). Runs with the same in-container DATABASE_URL
  # as the api service. The explicit command is REQUIRED — oven/bun's default
  # CMD is a bare `bun` REPL that would exit 0 with no effect.
  migrate:
    image: oven/bun:1.4.3
    working_dir: /app/packages/db
    volumes:
      - .:/app
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-component_marketplace}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bunx", "drizzle-kit", "migrate"]
