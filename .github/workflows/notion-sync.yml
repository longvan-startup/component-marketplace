name: Notion sync

# Mirrors issues/PRs into a Notion database and @mentions the relevant
# teammate on review-request/assign/merge (Notion's own notification
# mechanism) — see docs/NOTION_SYNC.md for the setup this depends on and why
# it exists instead of Notion's built-in GitHub sync.
on:
  issues:
    types: [opened, edited, reopened, closed, assigned, unassigned, labeled, unlabeled]
  pull_request:
    types: [opened, edited, reopened, closed, ready_for_review, review_requested, review_request_removed]

permissions:
  contents: read

jobs:
  sync:
    name: Sync to Notion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Run notion-sync
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
          NOTION_GITHUB_USER_MAP: ${{ secrets.NOTION_GITHUB_USER_MAP }}
        run: bun scripts/notion-sync.mjs
