name: PR path summary

# Informational path summary for PRs:
# - `apps/web/**`               → Frontend domain (Văn)
# - `apps/api/**`, `packages/db/**` → Backend domain (Long)
# - anything else               → shared/infra/harness, allowed with normal review
# PRs may include any combination of domains. This workflow never blocks a PR
# or requires a domain label; normal CI quality and import-boundary checks remain.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paths:
    name: Changed path summary
    runs-on: ubuntu-latest
    steps:
      - name: Classify changed files
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const FRONT = (p) => p.startsWith('apps/web/');
            const BACK = (p) =>
              p.startsWith('apps/api/') || p.startsWith('packages/db/');
            const SHARED = (p) => p.startsWith('packages/shared/');
            const DOC = (p) =>
              p.endsWith('.md') ||
              p.includes('/mocks/') ||
              p.includes('/fixtures/');
            const kindOf = (p) =>
              DOC(p)
                ? 'docs'
                : FRONT(p)
                  ? 'frontend'
                  : BACK(p)
                    ? 'backend'
                    : SHARED(p)
                      ? 'shared'
                      : 'infra';

            const kinds = new Map();
            for (const f of files) {
              // Deleted files still count: removed code can also break a domain.
              const kind = kindOf(f.filename);
              if (!kinds.has(kind)) kinds.set(kind, []);
              kinds.get(kind).push(f.filename);
            }

            for (const [kind, list] of kinds) {
              console.log(`${kind}: ${list.length} file(s)`);
            }

            const front = kinds.get('frontend') ?? [];
            const back = kinds.get('backend') ?? [];

            core.notice(
              'PRs may span frontend, backend, shared, and infrastructure files without a domain label.',
            );
            if (front.length > 0) core.info('Frontend files: ' + front.join(', '));
            if (back.length > 0) core.info('Backend files: ' + back.join(', '));
