name: CD preparation

# CI-green pushes to main may publish immutable artifacts and stage a Vercel
# production build. This workflow never runs database migrations or promotes a
# deployment to production.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish-api-image:
    name: Publish API image by commit SHA
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI-verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cmp-api:sha-${{ github.event.workflow_run.head_sha }}
          labels: org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  stage-vercel:
    name: Build and stage Vercel services
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success' &&
      vars.VERCEL_PREPARATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_PREPARATION_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout CI-verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Skip until Vercel preparation is configured
        id: configuration
        shell: bash
        run: |
          if [[ -z "${VERCEL_TOKEN:-}" || ! "${VERCEL_ORG_ID:-}" =~ ^team_[A-Za-z0-9_-]+$ || ! "${VERCEL_PROJECT_ID:-}" =~ ^prj_[A-Za-z0-9_-]+$ ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel staging is not configured; no production target was changed."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Check for an existing staged deployment of this commit
        if: steps.configuration.outputs.configured == 'true'
        id: existing
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_PREPARATION_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=50")"
          staged_id="$(jq -r --arg sha "$TARGET_SHA" '
            [.deployments[]? | select(
              .meta.githubCommitSha == $sha and
              .target == "production" and
              (.readyState // .state) == "READY" and
              .aliasAssigned == false
            )] | sort_by(.created // 0) | last | (.uid // .id // empty)
          ' <<< "$response")"
          if [[ -n "$staged_id" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::A ready staged Vercel deployment already exists for this commit."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        if: steps.configuration.outputs.configured == 'true' && steps.existing.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        if: steps.configuration.outputs.configured == 'true' && steps.existing.outputs.exists != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install pinned Vercel CLI
        if: steps.configuration.outputs.configured == 'true' && steps.existing.outputs.exists != 'true'
        run: npm install --global vercel@65.12.1

      - name: Pull production settings and build staged artifact
        if: steps.configuration.outputs.configured == 'true' && steps.existing.outputs.exists != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_PREPARATION_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"

      - name: Upload staged production build without assigning domains
        if: steps.configuration.outputs.configured == 'true' && steps.existing.outputs.exists != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_PREPARATION_TOKEN }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >-
          vercel deploy --prebuilt --prod --skip-domain --yes
          --token="$VERCEL_TOKEN"
          --meta "githubCommitSha=$TARGET_SHA"
          --meta "githubCommitRef=main"

      - name: Verify exact commit is staged and not assigned to a domain
        if: steps.configuration.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_PREPARATION_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            response="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&limit=50")"
            verified="$(jq -r --arg sha "$TARGET_SHA" '
              [.deployments[]? | select(
                .meta.githubCommitSha == $sha and
                .target == "production" and
                (.readyState // .state) == "READY" and
                .aliasAssigned == false
              )] | length > 0
            ' <<< "$response")"
            if [[ "$verified" == "true" ]]; then
              echo "A ready immutable deployment for $TARGET_SHA is staged without production aliases."
              exit 0
            fi
            failed="$(jq -r --arg sha "$TARGET_SHA" '
              [.deployments[]? | select(
                .meta.githubCommitSha == $sha and
                .target == "production" and
                (.readyState // .state) == "ERROR"
              )] | length > 0
            ' <<< "$response")"
            if [[ "$failed" == "true" ]]; then
              echo "::error::Vercel reported a failed staged build for $TARGET_SHA."
              exit 1
            fi
            sleep 10
          done
          echo "::error::Vercel did not report a ready staged deployment for $TARGET_SHA."
          exit 1
