name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pin đúng .bun-version (1.4.3) — cùng phiên bản với Docker image (oven/bun:1.4.3)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Import boundaries between workspaces (docs/ENGINEERING.md) — exits 1 on
      # any cross-domain import; positive+negative rules are unit tested.
      - name: Boundary checks (workspace imports)
        run: bun run boundary

      - name: Lint (Biome)
        run: bun run lint

      # Typecheck bao phủ packages/shared + apps/api + apps/web
      - name: Typecheck
        run: bun run typecheck

      - name: Test (smoke)
        run: bun test

      - name: Build API + Shared
        run: bun run build:shared && bun run build:api

      - name: Build Web (Next.js)
        run: bun run build:web

  docker-runtime:
    name: Docker build & runtime smoke
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # bun + node_modules are needed because the compose migrate service
      # bind-mounts the repo and must resolve the LOCKFILE-PINNED drizzle-kit
      # (no network version drift).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Compose (base + isolation overlay)
        run: |
          docker compose config -q
          docker compose -f compose.yaml -f compose.verify.yaml config -q

      # Proves (positive + assertions) that verify.sh cleanup cannot touch any
      # other compose project's volumes (see scripts/test-compose-isolation.sh).
      - name: Compose isolation test (cleanup safety proof)
        run: bash scripts/test-compose-isolation.sh

      # Isolated project (cmp-verify-*), no host ports published, in-container
      # probes: /health + /health/db (real DB connection) + web /, then DB
      # migration smoke on a blank volume (tables + idempotency).
      - name: Docker runtime smoke (isolated project + DB migration smoke)
        run: bash scripts/verify.sh --docker-only

      - name: Compose status
        run: docker compose ps

      # No explicit tear-down: verify.sh's EXIT trap performs label-scoped
      # cleanup (cmp-verify-* only), and leftovers, if any, die with the
      # ephemeral runner. No global prune is ever run.
