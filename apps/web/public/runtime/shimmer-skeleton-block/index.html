<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shimmer Skeleton Block demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f4f4f5;
      }
      .wrap {
        height: 100%;
        display: grid;
        place-items: center;
      }
      .bar {
        position: relative;
        width: min(70%, 360px);
        height: 28px;
        border-radius: 8px;
        background: #e4e4e7;
        overflow: hidden;
      }
      .bar[data-tone='strong'] {
        background: #d4d4d8;
      }
      .bar::after {
        content: '';
        position: absolute;
        inset: 0;
        transform: translateX(-100%);
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
        animation: sweep var(--sweep, 1.5s) ease-in-out infinite;
      }
      @keyframes sweep {
        to {
          transform: translateX(100%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar::after {
          animation: none;
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="bar" id="bar" data-tone="soft"></div>
    </div>
    <script>
      ;(() => {
        var CHANNEL = 'luva-demo'
        var VERSION = 1
        var bar = document.getElementById('bar')

        window.addEventListener('message', (event) => {
          if (event.source !== window.parent) return
          var msg = event.data
          if (!msg || msg.source !== CHANNEL || msg.version !== VERSION) return
          if (msg.type !== 'knobs' || !msg.values) return
          var v = msg.values
          if (typeof v.duration === 'number') {
            const seconds = Math.min(3, Math.max(0.5, v.duration))
            bar.style.setProperty('--sweep', `${seconds}s`)
          }
          if (v.tone === 'soft' || v.tone === 'strong') bar.dataset.tone = v.tone
        })

        /* The page only answers messages from this window; the reply carries
           no data, so a '*' target origin is safe for the opaque sandbox origin. */
        window.parent.postMessage({ source: CHANNEL, version: VERSION, type: 'ready' }, '*')
      })()
    </script>
  </body>
</html>
