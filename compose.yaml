name: component-marketplace

services:
  # --- Frontend: Next.js ---
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - '${WEB_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    # Secrets KHÔNG nằm trong image — truyền qua .env khi cần
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # --- Backend: Bun + Express ---
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - '${API_PORT:-4000}:4000'
    environment:
      NODE_ENV: production
      PORT: 4000
      # URL dùng TRONG container — luôn trỏ tới service postgres qua mạng compose.
      # KHÔNG interpolate DATABASE_URL từ .env host (host dùng localhost:5433,
      # sai nếu đưa vào container). Secrets như POSTGRES_PASSWORD vẫn qua .env.
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-component_marketplace}
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # --- PostgreSQL local (production dùng Neon) ---
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-component_marketplace}
    ports:
      # Host port 5433 mặc định để tránh conflict với Postgres khác trên máy
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
